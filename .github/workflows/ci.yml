name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra voice
      - name: Lint
        run: uv run ruff check jarvis tests
      - name: Test
        run: uv run pytest -q
      - name: Installer syntax
        run: bash -n scripts/install.sh && bash -n scripts/bootstrap.sh && bash -n scripts/jarvis-launcher
